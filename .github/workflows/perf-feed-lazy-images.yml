name: Apply feed lazy-image optimization

on:
  push:
    paths:
      - '.github/workflows/perf-feed-lazy-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch feed image loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/feed-client.tsx')
          s=p.read_text()
          replacements={
            '<img src={author.avatar_url} alt="" className="h-full w-full object-cover object-center"/>':'<img src={author.avatar_url} alt="" loading="lazy" decoding="async" className="h-full w-full object-cover object-center"/>',
            '<img src={post.image_url} alt="Publicação" className="block h-auto max-h-[720px] w-auto max-w-full object-contain object-center"/>':'<img src={post.image_url} alt="Publicação" loading="lazy" decoding="async" className="block h-auto max-h-[720px] w-auto max-w-full object-contain object-center"/>',
            '<img src={cp.avatar_url} alt="" className="h-full w-full object-cover object-center"/>':'<img src={cp.avatar_url} alt="" loading="lazy" decoding="async" className="h-full w-full object-cover object-center"/>'
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'Expected snippet not found: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "GeekoPlay Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/feed-client.tsx
          git diff --cached --quiet && exit 0
          git commit -m "perf: lazy-load feed images and avatars"
          git push origin HEAD:main
