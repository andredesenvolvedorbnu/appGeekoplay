name: Apply realtime feed debounce optimization

on:
  push:
    paths:
      - '.github/workflows/perf-feed-realtime-debounce.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Debounce feed realtime refreshes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/feed-client.tsx')
          s=p.read_text()
          old="useEffect(()=>{void reload();const channel=supabase.channel('feed-live-v4').on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>void reload(false)).on('postgres_changes',{event:'*',schema:'public',table:'comments'},()=>void reload(false)).on('postgres_changes',{event:'*',schema:'public',table:'comment_reactions'},()=>void reload(false)).on('postgres_changes',{event:'*',schema:'public',table:'likes'},()=>void reload(false)).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},()=>void reload(false)).subscribe();return()=>{void supabase.removeChannel(channel)}},[supabase]);"
          new="useEffect(()=>{void reload();let timer:ReturnType<typeof setTimeout>|null=null;const scheduleReload=()=>{if(timer)clearTimeout(timer);timer=setTimeout(()=>void reload(false),300)};const channel=supabase.channel('feed-live-v4').on('postgres_changes',{event:'*',schema:'public',table:'posts'},scheduleReload).on('postgres_changes',{event:'*',schema:'public',table:'comments'},scheduleReload).on('postgres_changes',{event:'*',schema:'public',table:'comment_reactions'},scheduleReload).on('postgres_changes',{event:'*',schema:'public',table:'likes'},scheduleReload).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},scheduleReload).subscribe();return()=>{if(timer)clearTimeout(timer);void supabase.removeChannel(channel)}},[supabase]);"
          if old not in s:
            raise SystemExit('Expected realtime subscription snippet not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name "GeekoPlay Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/feed-client.tsx
          git diff --cached --quiet && exit 0
          git commit -m "perf: debounce feed realtime reloads"
          git push origin HEAD:main
