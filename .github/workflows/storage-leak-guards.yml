name: Storage leak guards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-leak-guards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove Geek Card media from the correct bucket
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/components/post-detail-client.tsx')
          text=p.read_text(encoding='utf-8')
          old="function storagePath(url:string|null){if(!url)return null;const marker='/storage/v1/object/public/posts/';const index=url.indexOf(marker);if(index<0)return null;try{return decodeURIComponent(url.slice(index+marker.length))}catch{return null}}"
          new="function storagePath(url:string|null,bucket='posts'){if(!url)return null;const marker=`/storage/v1/object/public/${bucket}/`;const index=url.indexOf(marker);if(index<0)return null;try{return decodeURIComponent(url.slice(index+marker.length).split('?')[0])}catch{return null}}"
          if text.count(old)!=1: raise SystemExit(f'post detail helper matches={text.count(old)}')
          text=text.replace(old,new,1)
          old="const galleryPaths=media.map(m=>m.storage_path).filter((path):path is string=>Boolean(path));const paths=[storagePath(post.image_url),storagePath(post.video_url),...galleryPaths].filter((path):path is string=>Boolean(path));if(paths.length)await supabase.storage.from('posts').remove(paths);location.href='/'"
          new="const galleryPaths=media.map(m=>m.storage_path).filter((path):path is string=>Boolean(path));if(post.post_type==='card'){const cardPath=storagePath(post.card_data?.photo_url||post.image_url,'geek-cards');if(cardPath)await supabase.storage.from('geek-cards').remove([cardPath])}else{const paths=[storagePath(post.image_url),storagePath(post.video_url),...galleryPaths].filter((path):path is string=>Boolean(path));if(paths.length)await supabase.storage.from('posts').remove(paths)}location.href='/'"
          if text.count(old)!=1: raise SystemExit(f'post detail delete matches={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('src/components/feed-client.tsx')
          text=p.read_text(encoding='utf-8')
          old="function storagePath(url:string|null){if(!url)return null;const marker='/storage/v1/object/public/posts/';const index=url.indexOf(marker);if(index<0)return null;try{return decodeURIComponent(url.slice(index+marker.length))}catch{return null}}"
          new="function storagePath(url:string|null,bucket='posts'){if(!url)return null;const marker=`/storage/v1/object/public/${bucket}/`;const index=url.indexOf(marker);if(index<0)return null;try{return decodeURIComponent(url.slice(index+marker.length).split('?')[0])}catch{return null}}"
          if text.count(old)!=1: raise SystemExit(f'feed helper matches={text.count(old)}')
          text=text.replace(old,new,1)
          old="const paths=[storagePath(post.image_url),storagePath(post.video_url)].filter((path):path is string=>Boolean(path));if(paths.length)await supabase.storage.from('posts').remove(paths);"
          new="if(post.post_type==='card'){const cardPath=storagePath(post.card_data?.photo_url||post.image_url,'geek-cards');if(cardPath)await supabase.storage.from('geek-cards').remove([cardPath])}else{const paths=[storagePath(post.image_url),storagePath(post.video_url)].filter((path):path is string=>Boolean(path));if(paths.length)await supabase.storage.from('posts').remove(paths)}"
          if text.count(old)!=1: raise SystemExit(f'feed delete matches={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit Geek Card cleanup
        run: |
          git config user.name "GeekoPlay Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/post-detail-client.tsx src/components/feed-client.tsx
          git commit -m "perf: clean Geek Card media from correct bucket [skip storage-leak-guards]"
          git push
