name: Storage leak guards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-leak-guards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Clean popup ad media on deletion
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/admin-popup-ads-client.tsx')
          text=p.read_text(encoding='utf-8')
          old="async function remove(ad:Ad){if(!window.confirm(`Excluir o anúncio “${ad.title}”?`))return;await supabase.from('ads').delete().eq('id',ad.id);await load()}"
          new="async function remove(ad:Ad){if(!window.confirm(`Excluir o anúncio “${ad.title}”?`))return;const {error}=await supabase.from('ads').delete().eq('id',ad.id);if(!error&&ad.image_url){const marker='/storage/v1/object/public/ads/';const encodedPath=ad.image_url.includes(marker)?ad.image_url.split(marker)[1]?.split('?')[0]:null;if(encodedPath){try{await supabase.storage.from('ads').remove([decodeURIComponent(encodedPath)])}catch{}}}await load()}"
          if text.count(old)!=1:
              raise SystemExit(f'Unexpected popup remove match count: {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit popup guard
        run: |
          git config user.name "GeekoPlay Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/admin-popup-ads-client.tsx
          git commit -m "perf: remove popup media with deleted ads [skip storage-leak-guards]"
          git push
