name: Optimize storage cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-storage-cache.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[skip storage-cache]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply conservative cache settings
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/components/feed-client.tsx'): [
                  ("cacheControl:'3600'", "cacheControl:'2592000'"),
              ],
              Path('src/components/pulse-strip.tsx'): [
                  ("cacheControl:'3600'", "cacheControl:'86400'"),
              ],
              Path('src/components/profile-client.tsx'): [
                  (".upload(path,file,{contentType:'image/webp',upsert:false})", ".upload(path,file,{contentType:'image/webp',cacheControl:'2592000',upsert:false})"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'{path}: no change made')
              path.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit optimization
        run: |
          git config user.name "GeekoPlay Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/feed-client.tsx src/components/pulse-strip.tsx src/components/profile-client.tsx
          git commit -m "perf: extend immutable media cache lifetimes [skip storage-cache]"
          git push
