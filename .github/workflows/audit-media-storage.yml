name: Audit media storage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-media-storage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Storage and media audit
        shell: bash
        run: |
          echo '=== STORAGE.FROM ==='
          grep -RIn --include='*.ts' --include='*.tsx' "storage\.from" src || true
          echo '=== UPLOAD CALLS ==='
          grep -RIn --include='*.ts' --include='*.tsx' "\.upload(" src || true
          echo '=== CACHE CONTROL ==='
          grep -RIn --include='*.ts' --include='*.tsx' "cacheControl" src || true
          echo '=== PUBLIC URL ==='
          grep -RIn --include='*.ts' --include='*.tsx' "getPublicUrl" src || true
          echo '=== VIDEO ELEMENTS ==='
          grep -RIn --include='*.tsx' "<video\|preload=" src || true
          echo '=== IMAGE OPTIMIZATION IMPORTS ==='
          grep -RIn --include='*.ts' --include='*.tsx' "optimizeImageFile\|compress.*Image" src || true
