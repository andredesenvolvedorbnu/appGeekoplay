name: Apply feed media egress optimizations

on:
  push:
    paths:
      - '.github/workflows/perf-feed-media-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch feed media behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/feed-client.tsx')
          s=p.read_text()
          replacements={
            "const MAX_VIDEO=50*1024*1024;":"const MAX_VIDEO=35*1024*1024;",
            "const maxSide=1800;":"const maxSide=1600;",
            "canvas.toBlob(resolve,'image/webp',0.84)":"canvas.toBlob(resolve,'image/webp',0.82)",
            "entry.intersectionRatio>=0.65":"entry.intersectionRatio>=0.85",
            "preload=\"metadata\"":"preload=\"none\"",
            "50 MB":"35 MB",
            "<img src={media.url} alt={`Foto ${index+1} da publicação`} className=\"block h-auto max-h-[720px] w-auto max-w-full object-contain object-center\"/>":"<img src={media.url} alt={`Foto ${index+1} da publicação`} loading=\"lazy\" decoding=\"async\" className=\"block h-auto max-h-[720px] w-auto max-w-full object-contain object-center\"/>"
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'Expected snippet not found: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "GeekoPlay Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/feed-client.tsx
          git diff --cached --quiet && exit 0
          git commit -m "perf: reduce feed media bandwidth"
          git push origin HEAD:main
