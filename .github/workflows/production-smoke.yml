name: Production smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://geekoplay.com'
          check_page(){
            path="$1"
            tmp="$(mktemp)"
            code="$(curl -L -sS --retry 4 --retry-delay 2 --retry-all-errors -o "$tmp" -w '%{http_code}' "$base$path")"
            echo "$path -> HTTP $code"
            test "$code" -ge 200 -a "$code" -lt 500
            grep -Eqi 'GeekoPlay|geekoplay' "$tmp"
            rm -f "$tmp"
          }
          check_asset(){
            path="$1"
            code="$(curl -L -sS --retry 4 --retry-delay 2 --retry-all-errors -o /dev/null -w '%{http_code}' "$base$path")"
            echo "$path -> HTTP $code"
            test "$code" -ge 200 -a "$code" -lt 400
          }
          check_page '/'
          check_page '/bem-vindo'
          check_asset '/manifest.webmanifest'
          check_asset '/sw.js'
