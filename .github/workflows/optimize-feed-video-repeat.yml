name: Optimize repeated feed video autoplay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-feed-video-repeat.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prevent repeated autoplay downloads in one session
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/components/feed-client.tsx')
          text=path.read_text(encoding='utf-8')
          marker="function FeedVideo({src}:{src:string}){\n"
          if text.count(marker)!=1:
              raise SystemExit('FeedVideo marker changed unexpectedly')
          text=text.replace(marker,"const autoplayedFeedVideos=new Set<string>();\n\n"+marker,1)
          old="""   if(manuallyPausedRef.current)return;\n   autoplayTimerRef.current=window.setTimeout(()=>{\n    autoplayTimerRef.current=null;\n    if(!visibleRef.current||manuallyPausedRef.current)return;\n"""
          new="""   if(manuallyPausedRef.current||autoplayedFeedVideos.has(src))return;\n   autoplayTimerRef.current=window.setTimeout(()=>{\n    autoplayTimerRef.current=null;\n    if(!visibleRef.current||manuallyPausedRef.current||autoplayedFeedVideos.has(src))return;\n"""
          if text.count(old)!=1:
              raise SystemExit('FeedVideo autoplay guard changed unexpectedly')
          text=text.replace(old,new,1)
          old_play="onPlay={()=>{manuallyPausedRef.current=false;pauseOtherFeedVideos()}}"
          new_play="onPlay={()=>{autoplayedFeedVideos.add(src);manuallyPausedRef.current=false;pauseOtherFeedVideos()}}"
          if text.count(old_play)!=1:
              raise SystemExit('FeedVideo onPlay changed unexpectedly')
          text=text.replace(old_play,new_play,1)
          path.write_text(text,encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit optimization
        run: |
          git config user.name "GeekoPlay Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/feed-client.tsx
          git commit -m "perf: autoplay each feed video once per session [skip repeat-autoplay]"
          git push
